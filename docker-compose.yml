services:
  crm:
    build: .
    container_name: funnelhub-crm
    restart: unless-stopped
    ports:
      # Set CRM_BIND in .env (e.g. your Tailscale IP). Defaults to localhost only.
      - "${CRM_BIND:-127.0.0.1}:${CRM_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - crm-data:/data

volumes:
  crm-data:
